name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --ci --runInBand

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build

  docker-build:
    name: Build runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker runtime image
        run: docker build --target runtime --tag homefit-backend:${{ github.sha }} .

      - name: Verify runtime base and native modules
        run: |
          docker run --rm --entrypoint sh homefit-backend:${{ github.sha }} \
            -c 'if apk info -e perl; then echo "Unexpected Perl package in runtime image"; exit 1; fi'
          docker run --rm --entrypoint node homefit-backend:${{ github.sha }} \
            -e "require('bcrypt'); require('@prisma/client'); console.log('Runtime native modules loaded')"
